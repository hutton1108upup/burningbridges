<!doctype html><meta charset="utf-8"><title>Generation Lab</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}video,img{max-width:100%;display:block;margin:1rem 0}button{margin:.5rem .25rem 0 0;padding:.5rem 1rem}pre{white-space:pre-wrap;background:#f5f5f5;padding:1rem}.muted{color:#666}</style><main><h1>照片 + 参考视频验证</h1><p>默认 dry-run。照片只保存在本机；5 秒视频是参考素材，不是生成结果。</p><p class="muted" id="config"></p><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button id="prepare" disabled>上传并准备</button><button id="submit" disabled>显式提交</button><p>恢复已有任务：Job ID <input id="job" size="38"> Task ID <input id="task" size="26"><button id="recover">恢复并查询</button><button id="poll" disabled>继续查询</button></p><img id="preview" hidden><video controls muted playsinline src="/media/reference/template"></video><p id="status"></p><section id="result" hidden></section><details><summary>查看准确的请求预览</summary><pre id="details"></pre></details><script>
const $=s=>document.querySelector(s),draftKey='generation-draft',stateKey='generation-state';let csrf,photoId,prepared,jobId,taskId,requestKey,ready=false,timer,currentStatus;const readable={CSRF_INVALID:'页面会话已过期，请刷新重试。',REFERENCE_NOT_PREPARED:'本地 5 秒参考片未准备好。',PHOTO_INVALID:'请选择有效的 JPEG、PNG 或 WebP 图片（最大 8MB）。',RESULT_NOT_READY:'结果尚未保存，请继续查询。'};function status(x){$('#status').textContent=readable[x]||x}async function boot(){try{const r=await fetch('/api/generation/session');if(!r.ok)throw Error();const d=await r.json();csrf=(document.cookie.match(/(?:^|; )gl_csrf=([^;]+)/)||[])[1];if(!csrf)throw Error();ready=true;$('#prepare').disabled=false;$('#config').textContent=d.mode==='dry-run'?'当前是 dry-run：未配置 HTTPS 输入地址或服务端 key，不会把照片发送给 provider。':'已开启显式提交；key 只在服务端读取。';const draft=JSON.parse(localStorage.getItem(draftKey)||'null');if(draft){photoId=draft.photoId||null;jobId=draft.jobId||null;taskId=draft.taskId||null;requestKey=draft.requestKey||null;$('#job').value=jobId||'';$('#task').value=taskId||'';if(jobId){const jr=await fetch('/api/generation/jobs/'+jobId,{headers:{'x-generation-csrf':csrf}});if(jr.ok)showJob((await jr.json()).job);}if(taskId)pollLoop();}}catch{status('无法建立本地会话，请刷新页面。')}}function save(){localStorage.setItem(draftKey,JSON.stringify({photoId,jobId,taskId,requestKey}))}async function post(url,body){if(!ready)throw Error('本地会话尚未准备好。');const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-generation-csrf':csrf},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function showJob(job){currentStatus=job.status;$('#poll').disabled=!job.taskId;jobId=job.id||jobId;taskId=job.taskId||taskId;$('#job').value=jobId||'';$('#task').value=taskId||'';save();status(`任务状态：${job.status}${job.resultState==='unavailable'?'；结果下载失败，可继续查询，不会重新提交。':''}`);if(job.resultState==='available'){const v=document.createElement('video');v.controls=true;v.src=`/api/generation/jobs/${jobId}/result`;const a=document.createElement('a');a.href=`/api/generation/jobs/${jobId}/result?download=1`;a.textContent='下载本地结果';$('#result').replaceChildren(v,a);$('#result').hidden=false;}}async function pollOnce(){if(!taskId)return;try{const d=await post('/api/generation/poll',{taskId});showJob(d.job);return d.job}catch(e){status(e.message)}}async function pollLoop(){clearTimeout(timer);const j=await pollOnce();if(j&&['pending','processing'].includes(j.status))timer=setTimeout(pollLoop,5000)}$('#prepare').onclick=async()=>{try{const f=$('#photo').files[0];if(!f)throw Error('请选择照片。');if(requestKey&&photoId&&['pending','processing','unknown','submitting'].includes(currentStatus)){status('已有未完成任务，请继续查询或恢复；不会创建新任务。');return;}if(requestKey&&photoId){clearTimeout(timer);requestKey=null;jobId=null;taskId=null;currentStatus=null;save();status('已选择新照片，请重新准备新的测试任务。');}const form=new FormData;form.append('photo',f);const u=await fetch('/api/generation/upload',{method:'POST',headers:{'x-generation-csrf':csrf},body:form}),ud=await u.json();if(!u.ok)throw Error(ud.error);photoId=ud.id;$('#preview').src=URL.createObjectURL(f);$('#preview').hidden=false;prepared=await post('/api/generation/prepare',{photoId});$('#details').textContent=JSON.stringify(prepared,null,2);save();$('#submit').disabled=!prepared.canSubmit;status(prepared.canSubmit?'已准备，可显式提交。':'已准备；当前只能查看 dry-run 请求预览。')}catch(e){status(e.message)}};$('#submit').onclick=async()=>{if(!prepared?.canSubmit||!photoId)return;$('#submit').disabled=true;requestKey=requestKey||crypto.randomUUID();save();try{const d=await post('/api/generation/submit',{photoId,requestKey});$('#details').textContent=JSON.stringify(d,null,2);showJob(d.job);if(d.job?.taskId)pollLoop();}catch(e){status(e.message)}};$('#poll').onclick=()=>pollLoop();$('#recover').onclick=async()=>{try{jobId=$('#job').value.trim();taskId=$('#task').value.trim();if(!jobId||!taskId)throw Error('恢复需要 Job ID 和 Task ID。');const d=await post('/api/generation/recover',{jobId,taskId});showJob(d.job);pollLoop()}catch(e){status(e.message)}};boot();
</script></main>
